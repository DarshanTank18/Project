<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sona</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: #dfa974;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            width: 350px;
            opacity: 0;
            transform: translateY(-20px);
            animation: fadeIn 0.8s ease-in-out forwards;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        h2 {
            text-align: center;
            color: white;
            margin-bottom: 20px;
        }
        .profile-info {
            color: white;
            font-size: 16px;
            margin-bottom: 15px;
            opacity: 0;
            transform: translateY(-10px);
            animation: fadeSlide 0.8s ease-in-out forwards;
            animation-delay: 0.2s;
        }
        @keyframes fadeSlide {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .btn {
            width: 100%;
            padding: 10px;
            background: white;
            color: #dfa974;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.3s, color 0.3s;
            margin-top: 10px;
        }
        .btn:hover {
            background: #c78a5c;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Profile</h2>
        <div class="profile-info"><strong>Username:</strong> {{ data.username }}</div>
        <div class="profile-info"><strong>Email:</strong> {{ data.email }}</div>
        <button class="btn" onclick="window.location.href='/update_profile'">Update Profile</button>
        <button class="btn" onclick="window.location.href='/logout'">Logout</button>
        <button class="btn" onclick="window.location.href='/index'">Back to Home</button>
    </div>
</body>
</html>
